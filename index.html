<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlateMessenger | Telegram Edition</title>
  <meta name="theme-color" content="#0f172a">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(15, 23, 42, 0.75);
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #0284c7, #6366f1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(51, 65, 85, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* РАЗМЕТКА В СТИЛЕ TELEGRAM WEB */
    .tg-layout {
      width: 100vw;
      height: 100vh;
      display: flex;
      background: #0f172a;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      position: relative;
    }

    @media (min-width: 900px) {
      .tg-layout {
        width: 92vw;
        height: 92vh;
        border-radius: 20px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
    }

    /* ЛЕВАЯ ПАНЕЛЬ (СПИСОК ЧАТОВ) */
    .sidebar {
      width: 340px;
      background: rgba(15, 23, 42, 0.95);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #0b1120;
    }

    .my-profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 12px;
      transition: 0.2s;
    }
    .my-profile-btn:hover { background: rgba(56, 189, 248, 0.1); }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .search-bar {
      padding: 10px 14px;
      background: #0b1120;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      outline: none;
      font-size: 0.9rem;
      transition: 0.3s;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(56, 189, 248, 0.3); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(51, 65, 85, 0.2);
      transition: background 0.2s ease;
    }
    .chat-item:hover, .chat-item.active { background: #1e293b; }
    .chat-item-info { flex: 1; overflow: hidden; }
    .chat-item-title { font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; }
    .chat-item-last { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

    /* ПРАВАЯ ЧАСТЬ (ОКНО ЧАТА) */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      position: relative;
    }

    .chat-header {
      padding: 12px 20px;
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
    }
    .chat-header-user { display: flex; align-items: center; gap: 12px; }

    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-size: cover;
      background-position: center;
      scroll-behavior: smooth;
    }

    /* СООБЩЕНИЯ */
    .msg-group {
      display: flex;
      gap: 10px;
      max-width: 75%;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .msg-bubble {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 16px;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .me .msg-bubble {
      background: var(--accent-gradient);
      border: none;
      color: #fff;
    }

    .msg-author { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 3px; }
    .me .msg-author { display: none; }
    
    .msg-text { font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .msg-meta { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; }
    .me .msg-meta { color: rgba(255,255,255,0.7); }

    /* ОПЦИИ СООБЩЕНИЯ (РЕАКЦИИ & ОТВЕТ) */
    .msg-reply-preview {
      background: rgba(0,0,0,0.2);
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    .reactions-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .reaction-chip {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .reaction-chip:hover { transform: scale(1.15); }

    /* ВВОД СООБЩЕНИЯ */
    .input-wrapper {
      padding: 12px 16px;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reply-bar-active {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 6px 12px;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .input-controls { display: flex; gap: 10px; align-items: center; }

    .input-field {
      flex: 1;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      outline: none;
      font-size: 0.95rem;
      transition: 0.3s;
    }
    .input-field:focus { border-color: var(--accent); }

    .send-btn {
      background: var(--accent-gradient);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 0 25px rgba(56, 189, 248, 0.8); }

    /* СТИКЕРЫ */
    .sticker-popover {
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 20;
      animation: popIn 0.2s ease;
    }
    .sticker-popover.active { display: grid; }
    .sticker-item { font-size: 2.2rem; cursor: pointer; text-align: center; transition: transform 0.2s; }
    .sticker-item:hover { transform: scale(1.3); }

    /* МОДАЛКИ (АВТОРИЗАЦИЯ И ПРОФИЛЬ) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      animation: fadeIn 0.3s ease;
    }

    .modal-box {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 0 40px rgba(0,0,0,0.7);
    }

    .btn-full {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-full:hover { opacity: 0.95; transform: translateY(-1px); }

    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; height: 100%; display: flex; }
      .sidebar.hidden { display: none; }
      .main-chat { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="tg-layout">
    
    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="my-profile-btn" id="openProfileBtn">
          <img src="" class="avatar" id="myAvatar">
          <div style="display:flex; flex-direction:column;">
            <span id="myName" style="font-weight:bold; font-size:0.9rem;">Имя</span>
            <span style="font-size:0.7rem; color:var(--accent);">Настройки ⚙️</span>
          </div>
        </div>
      </div>

      <div class="search-bar">
        <input type="tel" class="search-input" id="searchPhoneInput" placeholder="🔍 Найти человека по номеру...">
      </div>

      <div class="chat-list" id="chatList">
        <!-- Общий чат по умолчанию -->
        <div class="chat-item active" onclick="switchChat('global', 'Slate Lounge 🌐')">
          <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar">
          <div class="chat-item-info">
            <div class="chat-item-title">
              <span>Slate Lounge 🌐</span>
              <span style="font-size:0.7rem; color:var(--text-muted);">Общий</span>
            </div>
            <div class="chat-item-last">Публичный чат всех участников</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ПРАВАЯ ЧАСТЬ (ОКНО ЧАТА) -->
    <main class="main-chat">
      <header class="chat-header">
        <div class="chat-header-user">
          <button id="backBtn" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; display:none;">⬅️</button>
          <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar" id="activeChatAvatar">
          <div>
            <h3 id="activeChatTitle" style="font-size:1rem;">Slate Lounge 🌐</h3>
            <span style="font-size:0.75rem; color:#10b981;">● в сети</span>
          </div>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer">
        <!-- Сообщения будут рендериться здесь -->
      </div>

      <!-- ВСПЛЫВАЮЩИЕ СТИКЕРЫ -->
      <div class="sticker-popover" id="stickerPopover">
        <div class="sticker-item" onclick="sendSticker('🔥')">🔥</div>
        <div class="sticker-item" onclick="sendSticker('😎')">😎</div>
        <div class="sticker-item" onclick="sendSticker('❤️')">❤️</div>
        <div class="sticker-item" onclick="sendSticker('🚀')">🚀</div>
        <div class="sticker-item" onclick="sendSticker('💀')">💀</div>
        <div class="sticker-item" onclick="sendSticker('🗿')">🗿</div>
        <div class="sticker-item" onclick="sendSticker('👍')">👍</div>
        <div class="sticker-item" onclick="sendSticker('🎉')">🎉</div>
        <div class="sticker-item" onclick="sendSticker('😂')">😂</div>
        <div class="sticker-item" onclick="sendSticker('⚡')">⚡</div>
      </div>

      <!-- ЗОНА ВВОДА -->
      <footer class="input-wrapper">
        <div class="reply-bar-active" id="replyBar">
          <span id="replyBarText">Ответ на сообщение...</span>
          <button onclick="cancelReply()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">✕</button>
        </div>
        
        <div class="input-controls">
          <button style="background:none; border:none; font-size:1.4rem; cursor:pointer;" id="stickerToggle">😊</button>
          <input type="text" class="input-field" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
          <button class="send-btn" id="sendBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- МОДАЛКА РЕГИСТРАЦИИ (TELEGRAM STYLE) -->
  <div class="modal-overlay" id="authModal" style="display:none;">
    <div class="modal-box">
      <h2 style="text-align:center; color:var(--accent);">Вход в SlateMessenger</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); text-align:center;">Введите ваш телефон и имя для подключения к серверу</p>
      <input type="tel" class="search-input" id="regPhone" placeholder="Номер телефона (+7...)" autocomplete="off">
      <input type="text" class="search-input" id="regName" placeholder="Ваше Имя / Ник" autocomplete="off">
      <button class="btn-full" id="authSubmitBtn">Войти в Телеграм</button>
    </div>
  </div>

  <!-- МОДАЛКА НАСТРОЕК ПРОФИЛЯ -->
  <div class="modal-overlay" id="profileModal" style="display:none;">
    <div class="modal-box">
      <h3 style="color:var(--accent);">Настройки TG Профиля</h3>
      <label style="font-size:0.8rem; color:var(--text-muted);">Имя:</label>
      <input type="text" class="search-input" id="editName">
      <label style="font-size:0.8rem; color:var(--text-muted);">URL Аватарки:</label>
      <input type="text" class="search-input" id="editAvatar">
      <label style="font-size:0.8rem; color:var(--text-muted);">Фон чата (URL картинки или цвет):</label>
      <input type="text" class="search-input" id="editBanner" placeholder="https://site.com/bg.jpg">
      
      <button class="btn-full" id="saveProfileBtn">Сохранить</button>
      <button class="btn-full" style="background:#ef4444;" id="logoutBtn">Выйти из аккаунта</button>
      <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" onclick="document.getElementById('profileModal').style.display='none'">Отмена</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJZ19JdSr_uxNxu4KqNUo4B6laebMWnXI",
      authDomain: "slatemessenger.firebaseapp.com",
      projectId: "slatemessenger",
      storageBucket: "slatemessenger.firebasestorage.app",
      messagingSenderId: "928705910432",
      appId: "1:928705910432:web:b77c43e57a8a21346a9bc5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;
    let activeChatId = 'global';
    let replyToMsg = null;
    let unsubscribeMessages = null;

    // ВХОД И АВТОРИЗАЦИЯ
    const savedPhone = localStorage.getItem('slate_phone');
    if (savedPhone) {
      db.collection('users').doc(savedPhone).get().then(doc => {
        if (doc.exists) {
          currentUser = doc.data();
          initApp();
        } else {
          document.getElementById('authModal').style.display = 'flex';
        }
      });
    } else {
      document.getElementById('authModal').style.display = 'flex';
    }

    document.getElementById('authSubmitBtn').addEventListener('click', async () => {
      const phone = document.getElementById('regPhone').value.trim().replace(/\s+/g, '');
      const name = document.getElementById('regName').value.trim();

      if (!phone) return alert('Введите номер!');

      const userRef = db.collection('users').doc(phone);
      const doc = await userRef.get();

      if (doc.exists) {
        currentUser = doc.data();
      } else {
        if (!name) return alert('Введите имя!');
        currentUser = {
          phone,
          name,
          avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`,
          banner: ''
        };
        await userRef.set(currentUser);
      }

      localStorage.setItem('slate_phone', phone);
      document.getElementById('authModal').style.display = 'none';
      initApp();
    });

    function initApp() {
      document.getElementById('myName').textContent = currentUser.name;
      document.getElementById('myAvatar').src = currentUser.avatar;
      applyBackground();
      loadMessages(activeChatId);
    }

    function applyBackground() {
      const container = document.getElementById('messagesContainer');
      if (currentUser && currentUser.banner) {
        if (currentUser.banner.startsWith('http')) {
          container.style.backgroundImage = `url('${currentUser.banner}')`;
        } else {
          container.style.background = currentUser.banner;
        }
      } else {
        container.style.background = '#0f172a';
      }
    }

    // ПЕРЕКЛЮЧЕНИЕ ЧАТОВ
    function switchChat(chatId, title, avatarUrl = null) {
      activeChatId = chatId;
      document.getElementById('activeChatTitle').textContent = title;
      document.getElementById('activeChatAvatar').src = avatarUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${chatId}`;
      loadMessages(chatId);

      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('backBtn').style.display = 'block';
      }
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('hidden');
      document.getElementById('backBtn').style.display = 'none';
    });

    // ПОИСК ПОЛЬЗОВАТЕЛЯ ПО НОМЕРУ
    document.getElementById('searchPhoneInput').addEventListener('keypress', async (e) => {
      if (e.key === 'Enter') {
        const queryPhone = e.target.value.trim();
        if (!queryPhone) return;

        const doc = await db.collection('users').doc(queryPhone).get();
        if (doc.exists) {
          const targetUser = doc.data();
          const dmId = [currentUser.phone, targetUser.phone].sort().join('_');
          
          // Добавляем в боковой список чатов если нет
          let existingItem = document.getElementById(`chat-item-${dmId}`);
          if (!existingItem) {
            const chatList = document.getElementById('chatList');
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.id = `chat-item-${dmId}`;
            item.onclick = () => switchChat(dmId, targetUser.name, targetUser.avatar);
            item.innerHTML = `
              <img src="${targetUser.avatar}" class="avatar">
              <div class="chat-item-info">
                <div class="chat-item-title">${targetUser.name}</div>
                <div class="chat-item-last">${targetUser.phone}</div>
              </div>
            `;
            chatList.appendChild(item);
          }
          switchChat(dmId, targetUser.name, targetUser.avatar);
          e.target.value = '';
        } else {
          alert('Пользователь с таким номером не найден!');
        }
      }
    });

    // ЗАГРУЗКА СООБЩЕНИЙ В РЕАЛЬНОМ ВРЕМЕНИ
    function loadMessages(chatId) {
      const container = document.getElementById('messagesContainer');
      if (unsubscribeMessages) unsubscribeMessages();
