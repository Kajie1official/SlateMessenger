<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlateMessenger</title>
  <meta name="theme-color" content="#0f172a">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    
    .app-container { width: 100%; max-width: 480px; height: 100vh; background-color: #1e293b; display: flex; flex-direction: column; box-shadow: 0 0 25px rgba(0, 0, 0, 0.5); position: relative; }
    @media (min-width: 500px) { .app-container { height: 90vh; border-radius: 16px; border: 1px solid #334155; } }

    /* ШАПКА */
    .header { padding: 14px 18px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .brand-title { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .user-profile-btn { display: flex; align-items: center; gap: 8px; cursor: pointer; background: #1e293b; padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; transition: 0.2s; }
    .user-profile-btn:hover { border-color: #38bdf8; }
    .avatar-mini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #38bdf8; }

    /* ЧАТ И БАННЕРЫ */
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; background-size: cover; background-position: center; position: relative; }
    
    .message-wrapper { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.2s ease-in-out; }
    .message-wrapper.my-msg { align-self: flex-end; flex-direction: row-reverse; }
    
    .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #6366f1; flex-shrink: 0; }
    .msg-content { display: flex; flex-direction: column; }
    .msg-author { font-size: 0.75rem; color: #94a3b8; margin-bottom: 2px; }
    .my-msg .msg-author { text-align: right; }
    
    .message { padding: 10px 14px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; background: #334155; color: #f1f5f9; }
    .my-msg .message { background: linear-gradient(135deg, #4f46e5, #0284c7); color: #fff; }
    .sticker-msg { background: transparent !important; font-size: 4rem; padding: 0; box-shadow: none !important; }

    /* ПАНЕЛЬ ВВОДА */
    .input-area { padding: 12px; background-color: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; position: relative; }
    .chat-input { flex: 1; background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 12px 14px; border-radius: 12px; outline: none; }
    .chat-input:focus { border-color: #38bdf8; }
    .icon-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 5px; opacity: 0.8; transition: 0.2s; }
    .icon-btn:hover { opacity: 1; transform: scale(1.1); }
    .btn-glow { background: linear-gradient(135deg, #6366f1, #38bdf8); color: #fff; border: none; padding: 12px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-glow:hover { box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }

    /* ПАНЕЛЬ СТИКЕРОВ */
    .sticker-picker { position: absolute; bottom: 70px; left: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; display: none; grid-template-columns: repeat(4, 1fr); gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 20; }
    .sticker-picker.active { display: grid; }
    .sticker-item { font-size: 2rem; cursor: pointer; text-align: center; transition: 0.2s; }
    .sticker-item:hover { transform: scale(1.2); }

    /* МОДАЛЬНЫЕ ОКНА (РЕГИСТРАЦИЯ И ПРОФИЛЬ) */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 14px; }
    .modal-title { font-size: 1.2rem; font-weight: bold; text-align: center; color: #38bdf8; }
    .modal-input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 8px; outline: none; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <div class="brand-title">SlateMessenger</div>
      <div class="user-profile-btn" id="openProfileBtn">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Slate" class="avatar-mini" id="myAvatarMini">
        <span id="headerUserName" style="font-size:0.85rem;">Профиль</span>
      </div>
    </header>

    <main class="chat-box" id="chatBox">
      <!-- Чат -->
    </main>

    <!-- Выбор стикеров -->
    <div class="sticker-picker" id="stickerPicker">
      <div class="sticker-item" onclick="sendSticker('🔥')">🔥</div>
      <div class="sticker-item" onclick="sendSticker('😎')">😎</div>
      <div class="sticker-item" onclick="sendSticker('🚀')">🚀</div>
      <div class="sticker-item" onclick="sendSticker('💀')">💀</div>
      <div class="sticker-item" onclick="sendSticker('👍')">👍</div>
      <div class="sticker-item" onclick="sendSticker('🗿')">🗿</div>
      <div class="sticker-item" onclick="sendSticker('⚡')">⚡</div>
      <div class="sticker-item" onclick="sendSticker('🎉')">🎉</div>
    </div>

    <footer class="input-area">
      <button class="icon-btn" id="stickerToggleBtn">😊</button>
      <input type="text" class="chat-input" id="messageInput" placeholder="Напишите сообщение..." autocomplete="off">
      <button class="btn-glow" id="sendBtn">Отправить</button>
    </footer>
  </div>

  <!-- Модалка Авторизации (при первом входе) -->
  <div class="modal" id="authModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-title">Вход в SlateMessenger</div>
      <p style="font-size: 0.85rem; color: #94a3b8; text-align: center;">Введите ваш номер телефона и имя для общения</p>
      <input type="text" class="modal-input" id="regPhone" placeholder="Номер телефона (+7...)">
      <input type="text" class="modal-input" id="regName" placeholder="Ваше Имя / Ник">
      <button class="btn-glow" id="saveAuthBtn">Войти в мессенджер</button>
    </div>
  </div>

  <!-- Модалка Кастомизации Профиля и Кастомного Баннера -->
  <div class="modal" id="profileModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-title">Настройки профиля</div>
      <label style="font-size: 0.8rem; color: #94a3b8;">Ссылка на Аватарку (URL):</label>
      <input type="text" class="modal-input" id="editAvatar" placeholder="https://example.com/avatar.jpg">
      
      <label style="font-size: 0.8rem; color: #94a3b8;">Ссылка на Баннер/Фон чата (URL или цвет):</label>
      <input type="text" class="modal-input" id="editBanner" placeholder="https://example.com/background.jpg">
      
      <button class="btn-glow" id="saveProfileBtn">Сохранить изменения</button>
      <button style="background:transparent; border:none; color:#94a3b8; cursor:pointer;" id="closeProfileBtn">Закрыть</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJZ19JdSr_uxNxu4KqNUo4B6laebMWnXI",
      authDomain: "slatemessenger.firebaseapp.com",
      projectId: "slatemessenger",
      storageBucket: "slatemessenger.firebasestorage.app",
      messagingSenderId: "928705910432",
      appId: "1:928705910432:web:b77c43e57a8a21346a9bc5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Текущий пользователь
    let currentUser = JSON.parse(localStorage.getItem('slate_user')) || null;

    const authModal = document.getElementById('authModal');
    const profileModal = document.getElementById('profileModal');
    const chatBox = document.getElementById('chatBox');
    const messageInput = document.getElementById('messageInput');
    const stickerPicker = document.getElementById('stickerPicker');

    // Проверка авторизации
    function checkAuth() {
      if (!currentUser) {
        authModal.style.display = 'flex';
      } else {
        authModal.style.display = 'none';
        updateUI();
      }
    }

    // Сохранение авторизации
    document.getElementById('saveAuthBtn').addEventListener('click', () => {
      const phone = document.getElementById('regPhone').value.trim();
      const name = document.getElementById('regName').value.trim();
      if (!phone || !name) return alert('Заполните все поля!');

      currentUser = {
        phone: phone,
        name: name,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`,
        banner: ''
      };

      localStorage.setItem('slate_user', JSON.stringify(currentUser));
      checkAuth();
    });

    // Обновление UI пользователя
    function updateUI() {
      if (!currentUser) return;
      document.getElementById('headerUserName').textContent = currentUser.name;
      document.getElementById('myAvatarMini').src = currentUser.avatar;

      if (currentUser.banner) {
        if (currentUser.banner.startsWith('http')) {
          chatBox.style.backgroundImage = `url('${currentUser.banner}')`;
        } else {
          chatBox.style.background = currentUser.banner;
        }
      }
    }

    // Открытие/Закрытие профиля
    document.getElementById('openProfileBtn').addEventListener('click', () => {
      document.getElementById('editAvatar').value = currentUser.avatar || '';
      document.getElementById('editBanner').value = currentUser.banner || '';
      profileModal.style.display = 'flex';
    });
    document.getElementById('closeProfileBtn').addEventListener('click', () => profileModal.style.display = 'none');

    // Сохранение изменений профиля
    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      currentUser.avatar = document.getElementById('editAvatar').value.trim() || currentUser.avatar;
      currentUser.banner = document.getElementById('editBanner').value.trim();
      localStorage.setItem('slate_user', JSON.stringify(currentUser));
      updateUI();
      profileModal.style.display = 'none';
    });

    // Стикеры
    document.getElementById('stickerToggleBtn').addEventListener('click', () => {
      stickerPicker.classList.toggle('active');
    });

    function sendSticker(stickerEmoji) {
      sendMessage(stickerEmoji, true);
      stickerPicker.classList.remove('active');
    }

    // Отправка сообщений
    function sendMessage(textToSend = null, isSticker = false) {
      const text = textToSend || messageInput.value.trim();
      if (!text || !currentUser) return;

      db.collection("messages").add({
        text: text,
        senderPhone: currentUser.phone,
        senderName: currentUser.name,
        senderAvatar: currentUser.avatar,
        isSticker: isSticker,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        if (!textToSend) messageInput.value = '';
      });
    }

    document.getElementById('sendBtn').addEventListener('click', () => sendMessage());
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // Слушатель сообщений Firestore
    db.collection("messages").orderBy("createdAt", "asc")
      .onSnapshot((snapshot) => {
        chatBox.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          if (!data.text) return;

          const isMy = currentUser && data.senderPhone === currentUser.phone;

          const msgWrapper = document.createElement('div');
          msgWrapper.className = `message-wrapper ${isMy ? 'my-msg' : ''}`;

          const isSticker = data.isSticker;

          msgWrapper.innerHTML = `
            <img src="${data.senderAvatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=user'}" class="msg-avatar">
            <div class="msg-content">
              <div class="msg-author">${data.senderName || 'Пользователь'}</div>
              <div class="message ${isSticker ? 'sticker-msg' : ''}">${data.text}</div>
            </div>
          `;

          chatBox.appendChild(msgWrapper);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      });

    checkAuth();
  </script>
</body>
</html>
