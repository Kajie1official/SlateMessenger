<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlateMessenger | Telegram Edition</title>
  <meta name="theme-color" content="#0f172a">
  
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #0284c7, #6366f1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(51, 65, 85, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    .tg-layout { width: 100vw; height: 100vh; display: flex; background: #0f172a; position: relative; }
    @media (min-width: 900px) { .tg-layout { width: 92vw; height: 92vh; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; } }

    /* САЙДБАР */
    .sidebar { width: 340px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
    .sidebar-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: #0b1120; }
    
    .my-profile-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 10px; border-radius: 12px; background: #1e293b; border: 1px solid var(--border); transition: 0.2s; }
    .my-profile-btn:hover { border-color: var(--accent); }

    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }

    .search-bar { padding: 10px 14px; background: #0b1120; }
    .search-input { width: 100%; background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 12px; outline: none; font-size: 0.9rem; }
    .search-input:focus { border-color: var(--accent); }

    .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(51, 65, 85, 0.2); transition: 0.2s; }
    .chat-item:hover, .chat-item.active { background: #1e293b; }

    /* ОПИСАНИЕ ЧАТА */
    .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
    .chat-header { padding: 12px 20px; background: rgba(11, 17, 32, 0.9); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; z-index: 5; }

    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-size: cover; background-position: center; }

    .msg-group { display: flex; gap: 10px; max-width: 75%; animation: popIn 0.2s ease; }
    .msg-group.me { align-self: flex-end; flex-direction: row-reverse; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .msg-bubble { background: #1e293b; padding: 10px 14px; border-radius: 16px; border: 1px solid var(--border); }
    .me .msg-bubble { background: var(--accent-gradient); border: none; color: #fff; }
    .msg-author { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 3px; }
    .me .msg-author { display: none; }
    .msg-meta { font-size: 0.65rem; color: var(--text-muted); text-align: right; margin-top: 4px; }

    /* ВВОД */
    .input-wrapper { padding: 12px 16px; background: rgba(11, 17, 32, 0.95); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .input-field { flex: 1; background: #1e293b; border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 14px; outline: none; }
    .send-btn { background: var(--accent-gradient); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* МОДАЛКИ */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #1e293b; border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: 90%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto; }

    .tab-container { display: flex; gap: 10px; background: #0f172a; padding: 4px; border-radius: 12px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); border-radius: 8px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--card-bg); color: #fff; border: 1px solid var(--border); }

    .btn-full { background: var(--accent-gradient); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-full:hover { opacity: 0.9; }

    .file-input-label { display: block; padding: 10px; background: #0f172a; border: 1px dashed var(--accent); border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.85rem; color: var(--accent); }
    
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; height: 100%; }
      .sidebar.hidden { display: none; }
    }
  </style>
</head>
<body>

  <div class="tg-layout">
    
    <!-- САЙДБАР -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="my-profile-btn" id="openProfileBtn">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=user" class="avatar" id="myAvatar">
          <div style="display:flex; flex-direction:column;">
            <span id="myName" style="font-weight:bold; font-size:0.9rem;">Профиль</span>
            <span style="font-size:0.7rem; color:var(--accent);">Настройки ⚙️</span>
          </div>
        </div>
      </div>

      <div class="search-bar">
        <input type="tel" class="search-input" id="searchPhoneInput" placeholder="🔍 Поиск по номеру...">
      </div>

      <div class="chat-list" id="chatList">
        <div class="chat-item active" onclick="switchChat('global', 'Slate Lounge 🌐')">
          <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar">
          <div>
            <div style="font-weight:600;">Slate Lounge 🌐</div>
            <div style="font-size:0.8rem; color:var(--text-muted);">Общий чат</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ЧАТ -->
    <main class="main-chat">
      <header class="chat-header">
        <button id="backBtn" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; display:none;">⬅️</button>
        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar" id="activeChatAvatar">
        <div>
          <h3 id="activeChatTitle" style="font-size:1rem;">Slate Lounge 🌐</h3>
          <span style="font-size:0.75rem; color:#10b981;">● в сети</span>
        </div>
      </header>

      <div class="messages-container" id="messagesContainer"></div>

      <footer class="input-wrapper">
        <input type="text" class="input-field" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
        <button class="send-btn" id="sendBtn">➔</button>
      </footer>
    </main>
  </div>

  <!-- МОДАЛКА АВТОРИЗАЦИИ И ВХОДА (ВКЛАДКИ) -->
  <div class="modal-overlay" id="authModal" style="display:flex;">
    <div class="modal-box">
      <div class="tab-container">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Вход</button>
        <button class="tab-btn" id="tabRegBtn" onclick="switchAuthTab('reg')">Регистрация</button>
      </div>

      <!-- ФОРМА ВХОДА -->
      <div id="loginForm" style="display:flex; flex-direction:column; gap:12px;">
        <input type="tel" class="search-input" id="loginPhone" placeholder="Номер телефона (+7...)">
        <input type="password" class="search-input" id="loginPassword" placeholder="Ваш пароль">
        <button class="btn-full" id="doLoginBtn">Войти</button>
      </div>

      <!-- ФОРМА РЕГИСТРАЦИИ -->
      <div id="regForm" style="display:none; flex-direction:column; gap:12px;">
        <input type="tel" class="search-input" id="regPhone" placeholder="Номер телефона (+7...)">
        <input type="text" class="search-input" id="regName" placeholder="Ваше Имя / Ник">
        <input type="password" class="search-input" id="regPassword" placeholder="Придумайте пароль">
        <button class="btn-full" id="doRegBtn">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА НАСТРОЕК ПРОФИЛЯ -->
  <div class="modal-overlay" id="profileModal" style="display:none;">
    <div class="modal-box">
      <h3 style="color:var(--accent);">Настройки Профиля</h3>
      
      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Имя (смена 1 раз в 7 дней):</label>
        <input type="text" class="search-input" id="editName">
        <span id="nameChangeNotice" style="font-size:0.75rem; color:#ef4444; display:none; margin-top:4px;"></span>
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Аватарка (из файла):</label>
        <label class="file-input-label">
          📁 Выбрать изображение аватара
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
        </label>
        <img id="avatarPreview" style="width:50px; height:50px; border-radius:50%; margin-top:8px; display:none; object-fit:cover;">
      </div>

      <div>
        <label style="font-size:0.8rem; color:var(--text-muted);">Фон чата (из файла):</label>
        <label class="file-input-label">
          🎨 Выбрать изображение фона
          <input type="file" id="bannerFileInput" accept="image/*" style="display:none;">
        </label>
      </div>

      <button class="btn-full" id="saveProfileBtn">Сохранить изменения</button>
      <button class="btn-full" style="background:#ef4444;" id="logoutBtn">Выйти из аккаунта</button>
      <button style="background:none; border:none; color:var(--text-muted); cursor:pointer;" id="closeProfileBtn">Отмена</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDJZ19JdSr_uxNxu4KqNUo4B6laebMWnXI",
      authDomain: "slatemessenger.firebaseapp.com",
      projectId: "slatemessenger",
      storageBucket: "slatemessenger.firebasestorage.app",
      messagingSenderId: "928705910432",
      appId: "1:928705910432:web:b77c43e57a8a21346a9bc5"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentUser = null;
    let activeChatId = 'global';
    let tempAvatarBase64 = null;
    let tempBannerBase64 = null;

    // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ВХОД / РЕГИСТРАЦИЯ
    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('tabLoginBtn').classList.add('active');
        document.getElementById('tabRegBtn').classList.remove('active');
        document.getElementById('loginForm').style.display = 'flex';
        document.getElementById('regForm').style.display = 'none';
      } else {
        document.getElementById('tabRegBtn').classList.add('active');
        document.getElementById('tabLoginBtn').classList.remove('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('regForm').style.display = 'flex';
      }
    }

    // АВТО-ВХОД
    const savedPhone = localStorage.getItem('slate_phone');
    if (savedPhone) {
      db.collection('users').doc(savedPhone).get().then(doc => {
        if (doc.exists) {
          currentUser = doc.data();
          document.getElementById('authModal').style.display = 'none';
          initApp();
        } else {
          document.getElementById('authModal').style.display = 'flex';
        }
      });
    }

    // РЕГИСТРАЦИЯ
    document.getElementById('doRegBtn').addEventListener('click', async () => {
      const phone = document.getElementById('regPhone').value.trim().replace(/\s+/g, '');
      const name = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPassword').value.trim();

      if (!phone || !name || !password) return alert('Заполните ВСЕ поля!');

      const userRef = db.collection('users').doc(phone);
      const doc = await userRef.get();

      if (doc.exists) {
        return alert('Пользователь с таким номером уже существует! Выполните вход.');
      }

      currentUser = {
        phone,
        name,
        password,
        avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`,
        banner: '',
        lastNameChange: Date.now()
      };

      await userRef.set(currentUser);
      localStorage.setItem('slate_phone', phone);
      document.getElementById('authModal').style.display = 'none';
      initApp();
    });

    // ВХОД
    document.getElementById('doLoginBtn').addEventListener('click', async () => {
      const phone = document.getElementById('loginPhone').value.trim().replace(/\s+/g, '');
      const password = document.getElementById('loginPassword').value.trim();

      if (!phone || !password) return alert('Заполните номер и пароль!');

      const userRef = db.collection('users').doc(phone);
      const doc = await userRef.get();

      if (!doc.exists) {
        return alert('Аккаунт не найден! Зарегистрируйтесь.');
      }

      const userData = doc.data();
      if (userData.password !== password) {
        return alert('Неверный пароль!');
      }

      currentUser = userData;
      localStorage.setItem('slate_phone', phone);
      document.getElementById('authModal').style.display = 'none';
      initApp();
    });

    function initApp() {
      document.getElementById('myName').textContent = currentUser.name;
      document.getElementById('myAvatar').src = currentUser.avatar;
      applyBackground();
      loadMessages(activeChatId);
    }

    function applyBackground() {
      const container = document.getElementById('messagesContainer');
      if (currentUser && currentUser.banner) {
        container.style.backgroundImage = `url('${currentUser.banner}')`;
      } else {
        container.style.background = '#0f172a';
      }
    }

    // ОТКРЫТИЕ И НАСТРОЙКИ ПРОФИЛЯ
    document.getElementById('openProfileBtn').addEventListener('click', () => {
      if (!currentUser) return;

      const editNameInput = document.getElementById('editName');
      const notice = document.getElementById('nameChangeNotice');
      
      editNameInput.value = currentUser.name;

      // Проверка 7 дней
      const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;
      const lastChange = currentUser.lastNameChange || 0;
      const timePassed = Date.now() - lastChange;

      if (lastChange && timePassed < SEVEN_DAYS) {
        const daysLeft = Math.ceil((SEVEN_DAYS - timePassed) / (24 * 60 * 60 * 1000));
        editNameInput.disabled = true;
        notice.textContent = `Менять имя можно через ${daysLeft} дн.`;
        notice.style.display = 'block';
      } else {
        editNameInput.disabled = false;
        notice.style.display = 'none';
      }

      document.getElementById('profileModal').style.display = 'flex';
    });

    document.getElementById('closeProfileBtn').addEventListener('click', () => {
      document.getElementById('profileModal').style.display = 'none';
    });

    // СЖАТИЕ И КОНВЕРТАЦИЯ ИЗОБРАЖЕНИЙ В BASE64
    function compressAndConvert(file, maxWidth, maxHeight, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
          if (h > maxHeight) { w *= maxHeight / h; h = maxHeight; }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.8));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ФАЙЛ АВАТАРА
    document.getElementById('avatarFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressAndConvert(file, 200, 200, (base64) => {
        tempAvatarBase64 = base64;
        const prev = document.getElementById('avatarPreview');
        prev.src = base64;
        prev.style.display = 'block';
      });
    });

    // ФАЙЛ БАННЕРА
    document.getElementById('bannerFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressAndConvert(file, 800, 600, (base64) => {
        tempBannerBase64 = base64;
        alert('Фон выбран!');
      });
    });

    // СОХРАНЕНИЕ ПРОФИЛЯ
    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
      const newName = document.getElementById('editName').value.trim();

      if (newName !== currentUser.name && !document.getElementById('editName').disabled) {
        currentUser.name = newName;
        currentUser.lastNameChange = Date.now();
      }

      if (tempAvatarBase64) currentUser.avatar = tempAvatarBase64;
      if (tempBannerBase64) currentUser.banner = tempBannerBase64;

      await db.collection('users').doc(currentUser.phone).update(currentUser);
      initApp();
      document.getElementById('profileModal').style.display = 'none';
      alert('Профиль обновлен!');
    });

    // ВЫХОД
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('slate_phone');
      location.reload();
    });

    // ЧАТЫ И СООБЩЕНИЯ
    function switchChat(chatId, title, avatarUrl = null) {
      activeChatId = chatId;
      document.getElementById('activeChatTitle').textContent = title;
      document.getElementById('activeChatAvatar').src = avatarUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${chatId}`;
      loadMessages(chatId);
    }

    function loadMessages(chatId) {
      const container = document.getElementById('messagesContainer');
      db.collection('messages')
        .where('chatId', '==', chatId)
        .orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          container.innerHTML = '';
          snapshot.forEach((doc) => {
            const data = doc.data();
            const isMe = currentUser && data.senderPhone === currentUser.phone;

            const group = document.createElement('div');
            group.className = `msg-group ${isMe ? 'me' : ''}`;

            const date = data.createdAt ? new Date(data.createdAt.seconds * 1000) : new Date();
            const timeStr = `${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;

            group.innerHTML = `
              <img src="${data.senderAvatar}" class="avatar" style="width:32px; height:32px;">
              <div class="msg-bubble">
                <div class="msg-author">${data.senderName}</div>
                <div>${data.text}</div>
                <div class="msg-meta">${timeStr}</div>
              </div>
            `;
            container.appendChild(group);
          });
          container.scrollTop = container.scrollHeight;
        });
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessa
