<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Clone</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #0e1621; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }

    /* МОДАЛКА АВТОРИЗАЦИИ */
    .auth-modal {
      background: #17212b;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid #2b3b4e;
    }
    .auth-modal h2 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
      color: #6ab3f3;
    }
    .auth-modal .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #0e1621;
      border-radius: 10px;
      padding: 4px;
    }
    .auth-modal .tabs button {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #8b9bb5;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .auth-modal .tabs button.active {
      background: #2b3b4e;
      color: #fff;
    }
    .auth-modal .form-group {
      margin-bottom: 16px;
    }
    .auth-modal .form-group label {
      display: block;
      font-size: 13px;
      color: #8b9bb5;
      margin-bottom: 6px;
    }
    .auth-modal .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0e1621;
      border: 1px solid #2b3b4e;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    .auth-modal .form-group input:focus {
      border-color: #6ab3f3;
    }
    .auth-modal .form-group input::placeholder {
      color: #5e6f8d;
    }
    .auth-modal .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-modal .btn-primary {
      background: #6ab3f3;
      color: #fff;
    }
    .auth-modal .btn-primary:hover {
      background: #4a9de0;
    }
    .auth-modal .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-modal .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
    .auth-modal .success-msg {
      color: #43b581;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* ПРИЛОЖЕНИЕ */
    .app { display: none; width: 100%; height: 100vh; }
    .app.active { display: flex; }

    /* САЙДБАР */
    .sidebar {
      width: 320px;
      background: #17212b;
      border-right: 1px solid #2b3b4e;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header {
      padding: 12px 16px;
      background: #1e2a36;
      border-bottom: 1px solid #2b3b4e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .user-info:hover { background: #2b3b4e; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #6ab3f3;
    }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-status { font-size: 12px; color: #8b9bb5; }

    .search-container {
      padding: 8px 12px;
      border-bottom: 1px solid #2b3b4e;
    }
    .search-input {
      width: 100%;
      padding: 8px 14px;
      background: #0e1621;
      border: 1px solid #2b3b4e;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #6ab3f3; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid transparent;
    }
    .chat-item:hover { background: #2b3b4e; }
    .chat-item.active {
      background: #2b3b4e;
      border-left: 3px solid #6ab3f3;
    }
    .chat-item .chat-name { font-weight: 500; font-size: 14px; }
    .chat-item .chat-last-msg {
      font-size: 13px;
      color: #8b9bb5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ОСНОВНОЙ ЧАТ */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0e1621;
    }
    .chat-header {
      padding: 8px 16px;
      background: #1e2a36;
      border-bottom: 1px solid #2b3b4e;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
    }
    .chat-title { font-weight: 600; font-size: 16px; }
    .chat-status { font-size: 12px; color: #8b9bb5; }
    .chat-status.online { color: #43b581; }

    .messages-container {
      flex: 1;
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-wrapper.out { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.in { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 6px 12px;
      border-radius: 12px;
      position: relative;
      word-break: break-word;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .msg-wrapper.out .msg-bubble {
      background: #2b5278;
      border-bottom-right-radius: 4px;
    }
    .msg-wrapper.in .msg-bubble {
      background: #1e2a36;
      border-bottom-left-radius: 4px;
    }
    .msg-author {
      font-size: 12px;
      color: #6ab3f3;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .msg-text { font-size: 14px; line-height: 1.4; }
    .msg-meta {
      font-size: 11px;
      color: #8b9bb5;
      margin-top: 2px;
      text-align: right;
    }
    .msg-wrapper.out .msg-meta { color: rgba(255,255,255,0.6); }

    /* ВВОД */
    .input-area {
      padding: 8px 12px;
      background: #1e2a36;
      border-top: 1px solid #2b3b4e;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msg-input {
      flex: 1;
      padding: 8px 14px;
      background: #0e1621;
      border: 1px solid #2b3b4e;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 36px;
      max-height: 120px;
    }
    .msg-input:focus { border-color: #6ab3f3; }
    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #6ab3f3;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:hover { background: #4a9de0; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .reply-bar {
      display: none;
      background: #2b3b4e;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #8b9bb5;
      align-items: center;
      justify-content: space-between;
    }
    .reply-bar .reply-close {
      background: none;
      border: none;
      color: #8b9bb5;
      cursor: pointer;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; }
      .sidebar.hidden { display: none; }
      .auth-modal { margin: 16px; }
    }
  </style>
</head>
<body>

<!-- ==================== МОДАЛКА АВТОРИЗАЦИИ ==================== -->
<div class="auth-modal" id="authModal">
  <h2>📱 Telegram</h2>
  
  <div class="tabs">
    <button class="active" onclick="switchAuthTab('login')">Вход</button>
    <button onclick="switchAuthTab('register')">Регистрация</button>
  </div>

  <!-- ВХОД -->
  <div class="auth-form active" id="loginForm">
    <div class="form-group">
      <label>Номер телефона</label>
      <input type="tel" id="loginPhone" placeholder="+7 900 123 45 67" value="+7">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="loginPassword" placeholder="Введите пароль">
    </div>
    <button class="btn btn-primary" id="loginBtn">Войти</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- РЕГИСТРАЦИЯ -->
  <div class="auth-form" id="registerForm">
    <div class="form-group">
      <label>Номер телефона</label>
      <input type="tel" id="regPhone" placeholder="+7 900 123 45 67" value="+7">
    </div>
    <div class="form-group">
      <label>Имя</label>
      <input type="text" id="regName" placeholder="Как вас зовут?">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="regPassword" placeholder="Придумайте пароль">
    </div>
    <div class="form-group">
      <label>Подтверждение пароля</label>
      <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль">
    </div>
    <button class="btn btn-primary" id="registerBtn">Зарегистрироваться</button>
    <div class="error-msg" id="regError"></div>
    <div class="success-msg" id="regSuccess"></div>
  </div>
</div>

<!-- ==================== ПРИЛОЖЕНИЕ ==================== -->
<div class="app" id="app">
  <!-- САЙДБАР -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="user-info" id="profileBtn">
        <img src="" class="avatar" id="myAvatar">
        <div>
          <div class="user-name" id="myName">Имя</div>
          <div class="user-status" id="myStatus">онлайн</div>
        </div>
      </div>
      <button onclick="logout()" style="background:none;border:none;color:#8b9bb5;font-size:20px;cursor:pointer;">🚪</button>
    </div>

    <div class="search-container">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск...">
    </div>

    <div class="chat-list" id="chatList">
      <div class="chat-item active" onclick="switchChat('global')">
        <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar" style="width:38px;height:38px;">
        <div>
          <div class="chat-name">🌐 Общий чат</div>
          <div class="chat-last-msg">Добро пожаловать!</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ОСНОВНОЙ ЧАТ -->
  <main class="main-chat">
    <header class="chat-header">
      <button onclick="toggleSidebar()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer;display:none;" id="backBtn">←</button>
      <img src="https://api.dicebear.com/7.x/identicon/svg?seed=global" class="avatar" style="width:38px;height:38px;" id="chatAvatar">
      <div>
        <div class="chat-title" id="chatTitle">Общий чат</div>
        <div class="chat-status online" id="chatStatus">онлайн</div>
      </div>
    </header>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="input-area">
      <div class="reply-bar" id="replyBar">
        <span id="replyText">Ответ...</span>
        <button class="reply-close" onclick="cancelReply()">✕</button>
      </div>
      <div class="input-row">
        <textarea class="msg-input" id="msgInput" placeholder="Написать сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </main>
</div>

<script>
// ==================== КОНФИГ FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyDJZ19JdSr_uxNxu4KqNUo4B6laebMWnXI",
  authDomain: "slatemessenger.firebaseapp.com",
  projectId: "slatemessenger",
  storageBucket: "slatemessenger.firebasestorage.app",
  messagingSenderId: "928705910432",
  appId: "1:928705910432:web:b77c43e57a8a21346a9bc5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
let currentUser = null;
let currentChat = 'global';
let replyTo = null;
let unsubscribeMessages = null;

// ==================== ХЭШИРОВАНИЕ ====================
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ==================== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ====================
function switchAuthTab(tab) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  
  if (tab === 'login') {
    document.querySelector('.tabs button:first-child').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelector('.tabs button:last-child').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  
  // Скрываем ошибки
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('regError').style.display = 'none';
  document.getElementById('regSuccess').style.display = 'none';
}

// ==================== РЕГИСТРАЦИЯ ====================
document.getElementById('registerBtn').addEventListener('click', async function() {
  const phone = document.getElementById('regPhone').value.trim().replace(/\s/g, '');
  const name = document.getElementById('regName').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regPasswordConfirm').value;
  
  const errorEl = document.getElementById('regError');
  const successEl = document.getElementById('regSuccess');
  errorEl.style.display = 'none';
  successEl.style.display = 'none';
  
  // Валидация
  if (!phone || phone.length < 10) {
    errorEl.textContent = '❌ Введите корректный номер телефона';
    errorEl.style.display = 'block';
    return;
  }
  if (!name) {
    errorEl.textContent = '❌ Введите ваше имя';
    errorEl.style.display = 'block';
    return;
  }
  if (password.length < 4) {
    errorEl.textContent = '❌ Пароль должен быть не менее 4 символов';
    errorEl.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errorEl.textContent = '❌ Пароли не совпадают';
    errorEl.style.display = 'block';
    return;
  }
  
  try {
    this.disabled = true;
    this.textContent = '⏳ Регистрация...';
    
    // Проверяем, существует ли пользователь
    const userDoc = await db.collection('users').doc(phone).get();
    if (userDoc.exists) {
      errorEl.textContent = '❌ Этот номер уже зарегистрирован. Войдите в аккаунт.';
      errorEl.style.display = 'block';
      this.disabled = false;
      this.textContent = 'Зарегистрироваться';
      return;
    }
    
    // Хэшируем пароль
    const hashedPassword = await hashPassword(password);
    
    // Создаем пользователя
    const userData = {
      phone: phone,
      name: name,
      password: hashedPassword,
      avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${phone}`,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    await db.collection('users').doc(phone).set(userData);
    
    successEl.textContent = '✅ Регистрация успешна! Войдите в аккаунт.';
    successEl.style.display = 'block';
    
    // Переключаем на вкладку входа
    setTimeout(() => {
      switchAuthTab('login');
      document.getElementById('loginPhone').value = phone;
      document.getElementById('regPhone').value = '';
      document.getElementById('regName').value = '';
      document.getElementById('regPassword').value = '';
      document.getElementById('regPasswordConfirm').value = '';
      successEl.style.display = 'none';
    }, 1500);
    
  } catch (error) {
    errorEl.textContent = '❌ Ошибка: ' + error.message;
    errorEl.style.display = 'block';
  } finally {
    this.disabled = false;
    this.textContent = 'Зарегистрироваться';
  }
});

// ==================== ВХОД ====================
document.getElementById('loginBtn').addEventListener('click', async function() {
  const phone = document.getElementById('loginPhone').value.trim().replace(/\s/g, '');
  const password = document.getElementById('loginPassword').value;
  
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';
  
  if (!phone || !password) {
    errorEl.textContent = '❌ Введите номер и пароль';
    errorEl.style.display = 'block';
    return;
  }
  
  try {
    this.disabled = true;
    this.textContent = '⏳ Вход...';
    
    const userDoc = await db.collection('users').doc(phone).get();
    if (!userDoc.exists) {
      errorEl.textContent = '❌ Пользователь не найден. Зарегистрируйтесь.';
      errorEl.style.display = 'block';
      this.disabled = false;
      this.textContent = 'Войти';
      return;
    }
    
    const userData = userDoc.data();
    const hashedPassword = await hashPassword(password);
    
    if (userData.password !== hashedPassword) {
      errorEl.textContent = '❌ Неверный пароль';
      errorEl.style.display = 'block';
      this.disabled = false;
      this.textContent = 'Войти';
      return;
    }
    
    // Успешный вход
    currentUser = userData;
    localStorage.setItem('telegram_user', phone);
    
    // Прячем модалку, показываем приложение
    document.getElementById('authModal').style.display = 'none';
    document.getElementById('app').classList.add('active');
    
    // Инициализируем
    initApp();
    
  } catch (error) {
    errorEl.textContent = '❌ Ошибка: ' + error.message;
    errorEl.style.display = 'block';
  } finally {
    this.disabled = false;
    this.textContent = 'Войти';
  }
});

// ==================== ПРОВЕРКА АВТО-ВХОДА ====================
(async function checkAutoLogin() {
  const savedPhone = localStorage.getItem('telegram_user');
  if (savedPhone) {
    try {
      const doc = await db.collection('users').doc(savedPhone).get();
      if (doc.exists) {
        currentUser = doc.data();
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('app').classList.add('active');
        initApp();
        return;
      }
    } catch (e) {
      console.log('Auto-login failed');
    }
  }
  // Показываем модалку
  document.getElementById('authModal').style.display = 'block';
})();

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
function initApp() {
  document.getElementById('myName').textContent = currentUser.name;
  document.getElementById('myAvatar').src = currentUser.avatar;
  document.getElementById('myStatus').textContent = 'онлайн';
  
  // Подписываемся на общий чат
  switchChat('global');
  
  // Загружаем список чатов
  loadChats();
}

// ==================== ЗАГРУЗКА СПИСКА ЧАТОВ ====================
function loadChats() {

// ==================== ПЕРЕКЛЮЧЕНИЕ ЧАТА ====================
function switchChat(
